<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TimeEntry Transfer</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:#eef3f1;color:#102e27;margin:0;min-height:100vh;display:grid;place-items:center}
.card{max-width:520px;margin:24px;background:white;border:1px solid #dce4e1;border-radius:18px;padding:28px;box-shadow:0 8px 24px rgba(15,48,40,.08);text-align:center}
.mark{width:72px;height:72px;border-radius:50%;display:grid;place-items:center;margin:0 auto 12px;background:#123b6b;color:#fff;border:4px solid #d9ad31;font-weight:900;font-size:24px}
h1{color:#123b6b;margin:0 0 8px}.muted{color:#68726f}.ok{color:#174d37;font-weight:900}.bad{color:#9b2f2f;font-weight:900}
</style>
</head>
<body>
<div class="card">
<div class="mark">TE</div>
<h1>TimeEntry Transfer</h1>
<p id="transferMessage" class="muted">Waiting for the Chrome extension…</p>
<p class="muted">After import, return to Salesforce and open the TimeEntry extension.</p>
</div>
</body>
</html>
