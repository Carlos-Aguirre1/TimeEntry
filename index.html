<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>TimeEntry — TAM Time Entry</title>
<link rel="icon" href="assets/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header id="app-shell">
  <div class="brand">
    <img class="app-logo" src="assets/icon.svg" alt="" width="40" height="40">
    <div><small>TAM • TIME ENTRY</small><h1>TimeEntry</h1></div>
  </div>
  <nav class="top-nav" aria-label="Primary">
    <button type="button" data-nav="home" data-path="/">Home</button>
    <button type="button" data-nav="portfolio" data-path="/portfolio">My Portfolio</button>
    <button type="button" data-nav="history" data-path="/history">History</button>
  </nav>
</header>
<main>
  <section id="dashboardScreen" data-screen="dashboard" class="hidden" aria-label="Dashboard"></section>
  <section id="portfolioScreen" data-screen="portfolio" class="hidden" aria-label="My Portfolio"></section>
  <section id="customerScreen" data-screen="customer" class="hidden" aria-label="Customer"></section>
  <section id="bulkScreen" data-screen="bulk" class="hidden" aria-label="Bulk Time Entry"></section>
  <section id="historyScreen" data-screen="history" class="hidden" aria-label="History"></section>
  <section id="entryScreen" data-screen="entry" class="hidden" aria-label="Time entry"></section>
</main>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script type="module" src="src/app.js"></script>
</body>
</html>
